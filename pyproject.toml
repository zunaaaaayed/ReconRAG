[project]
name = "reconrag"
version = "0.1.0"
description = "Evidence-grounded research assistant for sparse-view CT and 3D reconstruction literature"
readme = "README.md"
authors = [
    { name = "zunaaaaayed", email = "zunayedology@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "docling>=2.127.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.0.1",
    "streamlit>=1.64.0",
    "transformers>=5.17.0",
]

[project.scripts]
reconrag = "reconrag:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
